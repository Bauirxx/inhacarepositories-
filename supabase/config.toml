# Configuração do Supabase CLI para desenvolvimento local (supabase start).
# Em produção, as definições equivalentes são feitas no painel do Supabase.
project_id = "inhaca-connect"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "https://*.vercel.app/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m0s"

[auth.rate_limit]
email_sent = 10
sign_in_sign_ups = 30
token_refresh = 150

[realtime]
enabled = true
